<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Grab The Practical: the shelf</title>
  <meta name="description" content="Find practical photos and code for every subject, and download them.">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="container">
      <div class="top-in">
        <a class="brand" href="#home" aria-label="Grab The Practical, back to all subjects">
          <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
            <rect width="24" height="24" rx="6" fill="currentColor"/>
            <path d="M12 6.5v8m0 0-3.5-3.5M12 14.5l3.5-3.5M7 18h10" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
          <span>Grab The Practical</span>
        </a>
        <div class="search">
          <input id="q" type="search" placeholder="Search, e.g. practical 5 PPS" aria-label="Search practicals and code" autocomplete="off">
        </div>
        <a class="about-link" href="/">About</a>
        <div class="adminbar" id="adminbar" hidden><b>Admin mode</b><button class="btn quiet" id="lockBtn" type="button">Log out</button></div>
      </div>
      <div class="notice" id="notice" hidden></div>
    </div>
  </header>

  <main class="container page" id="main" aria-live="polite"></main>

  <footer class="foot"><div class="container foot-in"><span>Grab The Practical</span><span>Made by techprat for bhai sexual gang</span></div></footer>

  <input id="pick" type="file" accept="image/*" multiple hidden>
  <div id="status" hidden></div>
  <div id="toast" hidden role="status"></div>
  <div id="layer"></div>

  <noscript><p class="container">This site needs JavaScript to run.</p></noscript>
  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
